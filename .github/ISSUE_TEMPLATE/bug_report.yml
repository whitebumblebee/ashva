name: Bug report
description: Report reproducible behavior in the Android alpha
body:
  - type: markdown
    attributes:
      value: "For security issues, read SECURITY.md first. Never attach private PGNs, credentials, unredacted device logs or personal screens."
  - type: input
    id: environment
    attributes:
      label: App version, device and Android version
      placeholder: Ashva 0.3.1, Pixel emulator, Android 13
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include opening, line, color, Study/Practice and exact moves. Use a small synthetic PGN/FEN if needed.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Optional screenshot or redacted evidence
